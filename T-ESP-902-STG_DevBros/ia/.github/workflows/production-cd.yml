name: Deploy ia to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/inspiria-corp/ia:latest
          docker build -t $IMAGE -f ./Dockerfile .
          docker push $IMAGE

      - name: Trigger Dokploy application deploy
        run: |
          curl --fail --show-error --silent -X POST "${{ secrets.DOKPLOY_URI }}/api/compose.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -d "{\"composeId\":\"${{ secrets.DOKPLOY_COMPOSE_ID  }}\"}"
