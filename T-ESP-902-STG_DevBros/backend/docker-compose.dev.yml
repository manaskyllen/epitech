services:
  api:
    build:
      context: ./tools/docker
      dockerfile: php/Dockerfile.dev
    container_name: inspiria_api
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./tools/docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./shared_data:/var/www/html/storage/app/shared_data
    networks:
      - inspiria
    depends_on:
      - db

  web:
    image: nginx:latest
    ports:
      - 8000:80
    restart: always
    container_name: inspiria_web
    volumes:
      - ./public:/var/www/html/public
      - ./tools/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - inspiria
    depends_on:
      - api

  db:
    image: postgres:17.4
    container_name: inspiria_db
    environment:
      POSTGRES_DB: inspiria
      POSTGRES_USER: inspiria
      POSTGRES_PASSWORD: inspiria
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - inspiria

  pgAdmin:
    image: dpage/pgadmin4:latest
    container_name: inspiria_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - inspiria

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - inspiria
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" 
      - "9001:9001" 
    environment:
      MINIO_ROOT_USER: ${MINIO_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET}
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    networks:
      - inspiria
  python-service:
    build: python-api
    ports:
      - "5000:5000"
    volumes:
      - ./shared_data:/app/shared
    networks:
      - inspiria


networks:
  inspiria:
    driver: bridge

volumes:
  db_data:
  pgadmin_data:
  minio_data:
