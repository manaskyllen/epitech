version: "3.9"

services:
  api:
    image: ghcr.io/inspiria-corp/backend:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      APP_KEY: ${APP_KEY}
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: "true"
      APP_URL: ${APP_URL}
    
      APP_LOCALE: ${APP_LOCALE}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE}
    
      APP_MAINTENANCE_DRIVER: file
      PHP_CLI_SERVER_WORKERS: "4"
      BCRYPT_ROUNDS: "12"
    
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_DEPRECATIONS_CHANNEL: "null"
      LOG_LEVEL: debug
    
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    
      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"
      SESSION_ENCRYPT: "false"
      SESSION_PATH: /
      SESSION_DOMAIN: "null"
    
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: database
    
      CACHE_STORE: database
    
      MEMCACHED_HOST: 127.0.0.1
    
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PASSWORD: "null"
      REDIS_PORT: "6379"
    
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "465"
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ssl
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: Inspiria Corp
      MAIL_DRIVER: sendmail
    
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ""
      AWS_USE_PATH_STYLE_ENDPOINT: "false"
    
      VITE_APP_NAME: Inspiria
    
      MINIO_KEY: ${MINIO_KEY}
      MINIO_SECRET: ${MINIO_SECRET}
      MINIO_REGION: us-east-1
      MINIO_BUCKET: inspiria
      MINIO_ENDPOINT: minio
    
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    volumes:
      - shared_data:/var/www/html/storage/app/shared_data
    networks:
      - inspiria
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: ghcr.io/inspiria-corp/nginx:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - inspiria
      - dokploy-network

  db:
    image: postgres:17.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - inspiria

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET}
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data
    networks:
      - inspiria

  python-service:
    image: ghcr.io/inspiria-corp/backend-python-api:latest
    restart: unless-stopped             
    volumes:
      - shared_data:/app/shared
    networks:
      - inspiria

networks:
  inspiria:
  dokploy-network:
    external: true

volumes:
  db_data:
  minio_data:
  shared_data: